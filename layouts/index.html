{{ define "main" }}
<div class="items">
  {{ range .Site.RegularPages }}
  <div class="item">
    <div class="item-main">
      <div class="item-title">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </div>
      <div class="item-info">
        <div class="item-date">
          {{ .Date.Format "2006-01-02" }}
        </div>
      </div>
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
